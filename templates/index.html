<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pi Miner</title>
<style>:root{--green:#0f0;--line:#0b4;--muted:#999}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font:13px monospace}body{display:flex;align-items:center;justify-content:center}.screen{width:340px;padding:14px;background:#000;border-radius:16px;border:1px solid #222}.panel{aspect-ratio:480/320;padding:14px 16px;background:#0a0a0a;border-radius:6px;display:flex;flex-direction:column}.header{display:flex;align-items:center;gap:8px}.logo{width:20px;height:20px;object-fit:contain}.title{font-weight:bold;letter-spacing:.04em}.hr{height:2px;background:var(--line);margin:6px 0 10px}.hashrate{color:var(--green);font-size:26px;white-space:nowrap}.stats{margin-top:10px;line-height:1.6}.rejected{color:#f66}.divider{height:1px;background:#053;margin:10px 0}.market{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;line-height:1.5}.value{color:var(--green)}.spacer{flex:1}.updated{color:#666;font-size:10px}.settings{position:fixed;top:14px;right:14px;width:28px;height:28px;border:1px solid var(--line);background:#0a0a0a;border-radius:4px;color:var(--green);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:.2s}}.settings:hover{background:var(--line);color:#000}</style></head>
<body><a href="/settings" class="settings" title="Settings">⚙️</a><div class="screen"><div class="panel"><div class="header"><img id="logo" class="logo" alt=""><span class="title">PI MINER</span></div><div class="hr"></div><div class="hashrate" id="hashrate">-- kH/s</div><div class="stats"><div id="accepted">Accepted: --</div><div class="rejected" id="rejected">Rejected: --</div></div><div class="divider"></div><div class="market"><span id="coinLabel">DGB Price:</span><span class="value" id="price">Loading...</span></div><div class="market"><span>24h Change:</span><span class="value" id="change">--</span></div><div class="market"><span>Market Cap:</span><span class="value" id="cap">--</span></div><div class="spacer"></div><div class="updated" id="updated">Updated: --</div></div></div>
<script>
const coins={digibyte:{id:'digibyte',symbol:'DGB',logo:'https://assets.coingecko.com/coins/images/63/large/digibyte.png'},bitcoin:{id:'bitcoin',symbol:'BTC',logo:'https://assets.coingecko.com/coins/images/1/large/bitcoin.png'},litecoin:{id:'litecoin',symbol:'LTC',logo:'https://assets.coingecko.com/coins/images/2/large/litecoin.png'},dogecoin:{id:'dogecoin',symbol:'DOGE',logo:'https://assets.coingecko.com/coins/images/5/large/dogecoin.png'}};
let coin=localStorage.getItem('selectedCoin')||'digibyte';function money(n){return n>=1?'$'+n.toFixed(2):'$'+n.toFixed(8)}function compact(n){return n>=1e9?'$'+(n/1e9).toFixed(2)+'B':n>=1e6?'$'+(n/1e6).toFixed(2)+'M':'$'+Math.round(n)}
async function market(){const c=coins[coin]||coins.digibyte;document.querySelector('#logo').src=c.logo;document.querySelector('#coinLabel').textContent=c.symbol+' Price:';try{const r=await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${c.id}&vs_currencies=usd&include_market_cap=true&include_24hr_change=true`);const d=(await r.json())[c.id];document.querySelector('#price').textContent=money(d.usd);document.querySelector('#change').textContent=(d.usd_24h_change>=0?'+':'')+d.usd_24h_change.toFixed(2)+'%';document.querySelector('#cap').textContent=compact(d.usd_market_cap)}catch(e){document.querySelector('#price').textContent='Unavailable'}}
async function miner(){try{const d=await (await fetch('/api/miner/status',{cache:'no-store'})).json();if(d.hashrate)document.querySelector('#hashrate').textContent=d.hashrate+' '+(d.unit||'kH/s');if(d.accepted!=null)document.querySelector('#accepted').textContent='Accepted: '+d.accepted;if(d.rejected!=null)document.querySelector('#rejected').textContent='Rejected: '+d.rejected}catch(e){}}function clock(){document.querySelector('#updated').textContent='Updated: '+new Date().toLocaleTimeString('en-GB',{hour12:false})}market();miner();clock();setInterval(miner,5000);setInterval(clock,1000);setInterval(()=>{coin=localStorage.getItem('selectedCoin')||'digibyte';market()},60000);
</script></body></html>
